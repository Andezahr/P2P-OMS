databaseChangeLog:
  - changeSet:
      id: 002-create-p2p-ads-table
      author: andrey

      changes:
        - createTable:
            tableName: p2p_ads

            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: side
                  type: VARCHAR(8)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: NUMERIC(19,8)
                  constraints:
                    nullable: false

              - column:
                  name: min_limit
                  type: NUMERIC(19,8)
                  constraints:
                    nullable: false

              - column:
                  name: max_limit
                  type: NUMERIC(19,8)
                  constraints:
                    nullable: false

              - column:
                  name: total_amount
                  type: NUMERIC(19,8)
                  constraints:
                    nullable: false

              - column:
                  name: available_amount
                  type: NUMERIC(19,8)
                  constraints:
                    nullable: false

              - column:
                  name: reserved_amount
                  type: NUMERIC(19,8)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: p2p_ads
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_ad_maker_user

        - createIndex:
            tableName: p2p_ads
            indexName: idx_p2p_ads_user_id

            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: p2p_ads
            indexName: idx_p2p_ads_status

            columns:
              - column:
                  name: status