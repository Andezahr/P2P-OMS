databaseChangeLog:
  - changeSet:
      id: 001-create-users-table
      author: andrey

      changes:
        - createTable:
            tableName: users

            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(128)
                  constraints:
                    nullable: false

              - column:
                  name: balance
                  type: NUMERIC(19,8)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: ad_reserved_balance
                  type: NUMERIC(19,8)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: order_reserved_balance
                  type: NUMERIC(19,8)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - createIndex:
            tableName: users
            indexName: idx_users_email
            unique: true

            columns:
              - column:
                  name: email