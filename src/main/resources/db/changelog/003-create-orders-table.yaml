databaseChangeLog:
  - changeSet:
      id: 003-create-orders-table
      author: andrey

      changes:
        - createTable:
            tableName: orders

            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: maker_ad_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: maker_user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: taker_user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: NUMERIC(19,8)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: NUMERIC(19,8)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: maker_ad_id
            referencedTableName: p2p_ads
            referencedColumnNames: id
            constraintName: fk_order_ad

        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: maker_user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_order_maker_user

        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: taker_user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_order_taker_user

        - createIndex:
            tableName: orders
            indexName: idx_orders_status

            columns:
              - column:
                  name: status

        - createIndex:
            tableName: orders
            indexName: idx_orders_maker_user

            columns:
              - column:
                  name: maker_user_id

        - createIndex:
            tableName: orders
            indexName: idx_orders_taker_user

            columns:
              - column:
                  name: taker_user_id

        - createIndex:
            tableName: orders
            indexName: idx_orders_ad

            columns:
              - column:
                  name: maker_ad_id

        - createIndex:
            tableName: orders
            indexName: idx_orders_expires_at

            columns:
              - column:
                  name: expires_at