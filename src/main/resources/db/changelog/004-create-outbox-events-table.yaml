databaseChangeLog:
  - changeSet:
      id: 004-create-outbox-events-table
      author: andrey

      changes:
        - createTable:
            tableName: outbox_events

            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: event_type
                  type: VARCHAR(128)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: occurred_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: published
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false